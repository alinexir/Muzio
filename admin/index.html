<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>مدیریت</title><link rel="stylesheet" href="../css/style.css"><style>input{padding:8px;border-radius:8px;border:1px solid var(--s2);background:var(--s);color:var(--tx);font:inherit;width:100%}form{display:grid;gap:8px;max-width:520px}.arow{display:flex;gap:10px;align-items:center;margin:8px 0}.arow>div{flex:1;min-width:0}.arow button{padding:6px 10px;border-radius:10px;background:var(--s2);color:var(--tx)}.aph{width:44px;height:44px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--grad);color:#07060f;font-weight:800;flex:none}.aph img{width:100%;height:100%;object-fit:cover}.gset{display:grid;gap:8px;max-width:520px}.jrow{display:flex;gap:10px;align-items:center;margin:10px 0}.jrow img{width:64px;height:64px;border-radius:10px;object-fit:cover}.jrow>div{flex:1;min-width:0}audio{max-width:100%;height:32px}input[type=checkbox],input[type=color]{width:auto}input[type=color]{height:40px;padding:2px}.chk{display:flex;gap:8px;align-items:center}label{display:grid;gap:4px}.chk{display:flex}textarea{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{padding:8px 14px;font-size:.9rem}td,th{padding:6px 10px;text-align:right}table{width:100%;border-collapse:collapse}</style></head>
<body><main id="app"></main><script type="module" src="../js/admin.js"></script></body></html>
